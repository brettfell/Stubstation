<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StubStation Kiosk</title>
    <link rel="manifest" href="manifest.json">

    <style>
        /* --- THE KIOSK LOCKDOWN CSS --- */
        * {
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-user-drag: none; 
        }

        input {
            user-select: auto;
            -webkit-user-select: auto;
        }
        /* ------------------------------ */

        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto; 
        }

        #version-marker {
            position: fixed;
            top: 5px;
            left: 5px;
            color: #444;
            font-size: 12px;
            z-index: 99999;
        }

        #attract-screen {
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            margin-top: 30px;
            padding: 25px 50px;
            font-size: 2rem;
            background: orange;
            color: black;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
            width: 90%;
            max-width: 800px;
        }

        .product-card {
            background: rgba(51, 51, 51, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid orange;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price {
            font-size: 24px;
            color: #4CAF50;
            display: block;
            margin-bottom: 10px;
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: contain; 
            background: #111;    
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .main-header {
            text-align: center;
            margin: 40px 0; 
        }

        .brand-name {
            font-size: 4rem; 
            font-weight: 900;
            color: orange;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 1.5rem; 
            color: #ccc;
            margin-top: 5px;
            font-weight: 300;
        }

        #orderModal {
            display: none; 
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            color: white;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid orange;
            z-index: 10002;
            width: 85%;
            max-width: 450px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        .modal-input {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 1.1rem;
            background: #333;
            color: white;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        #customAlert {
            display: none; 
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            color: white;
            padding: 40px;
            border-radius: 20px;
            border: 3px solid red;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            z-index: 10005;
            width: 80%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div id="version-marker">v3.0 - MailerSend Integration</div>

    <div id="attract-screen" onclick="startKiosk()">
        <img src="menuBackground1.jpg" style="max-width: 70%; border-radius: 20px;" onerror="this.style.display='none'">
        <button class="start-btn">TOUCH HERE TO GET YOUR RETRO STYLED TICKET</button>
    </div>

    <div class="main-header">
        <div class="brand-name" id="display-venue">StubStation</div>
        <div class="tagline" id="display-event">Bring Home The Original Souvenir</div>
    </div>

    <div class="grid">
        <div class="product-card">
            <h2>Get your Souvenir Ticket Stub</h2>
            <span class="price">$5.00</span>
            <button onclick="buyProduct('Get your Souvenir Ticket Stub')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none; color:black; cursor:pointer;">SELECT</button>
        </div>

        <div class="product-card">
            <h2>Get your ticket stub and order a display case</h2>
            <span class="price">$35.00</span>
            <button onclick="buyProduct('Get your ticket stub and order a display case')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none; color:black; cursor:pointer;">SELECT</button>
        </div>
    </div>

    <div id="customAlert">
        <h2 id="alertMessage" style="color: white; margin-top: 0;">Message goes here</h2>
        <button onclick="closeAlert()" style="background: red; color: white; padding: 15px 30px; font-weight: bold; border: none; border-radius: 10px; font-size: 1.2rem; cursor: pointer; margin-top: 20px;">Got it!</button>
    </div>

    <div id="orderModal">
        <h2 id="modalTitle" style="color:orange; margin-top:0;">Ticket Details</h2>

        <label style="display: flex; align-items: center; margin-bottom: 15px; cursor: pointer; font-size: 1.1rem;">
            <input type="checkbox" id="gaCheckbox" onchange="toggleGA()" style="width: 20px; height: 20px; margin-right: 10px;">
            General Admission / Standing
        </label>

        <div id="seatFields">
            <input type="text" id="rowInput" class="modal-input" placeholder="Row (e.g., A)">
            <input type="text" id="seatInput" class="modal-input" placeholder="Seat (e.g., 12)">
        </div>

        <div id="shippingFields" style="display:none; border-top: 1px solid #444; margin-top:15px; padding-top:15px;">
            <h3 style="font-size:1rem; margin-bottom:10px;">Shipping for Display Case:</h3>
            <input type="text" id="shippingName" class="modal-input" placeholder="Full Name">
            <input type="text" id="shippingAddress" class="modal-input" placeholder="Street, City, Zip">
        </div>

        <!-- NEW DIGITAL RECEIPT SECTION -->
        <div style="margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
            <label style="display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 1.1rem;">
                <input type="checkbox" id="receiptCheckbox" onchange="toggleEmailInput()" style="width: 20px; height: 20px; margin-right: 10px;">
                Send me a digital receipt
            </label>
            <input type="email" id="customerEmail" class="modal-input" placeholder="Enter your email address" style="display: none; width: 90%;">
        </div>
        <!-- --------------------------- -->

        <div style="margin-top: 15px; background: #222; padding: 15px; border-radius: 10px; text-align: right;">
            <div>Subtotal: $<span id="displaySubtotal">0.00</span></div>
            <div style="color: #aaa; font-size: 0.9rem;">Tax: $<span id="displayTax">0.00</span></div>
            <div style="color: orange; font-size: 1.4rem; font-weight: bold; margin-top: 5px;">Total: $<span id="displayTotal">0.00</span></div>
        </div>

        <button onclick="processOrder()" style="width:100%; background:orange; color:black; padding:18px; margin-top:20px; font-weight:bold; border-radius:10px; border:none; font-size:1.3rem;">CONFIRM & PAY</button>
        <button onclick="closeModal()" style="background:transparent; color:#888; border:none; margin-top:10px; width:100%; cursor:pointer;">Cancel</button>
    </div>

    <div id="printingScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 10003; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: orange; font-size: 3rem; text-align: center;">PRINTING YOUR<br>SOUVENIR...</h1>
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid orange; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px;"></div>
    </div>

    <script>
        window.onerror = function(message, source, lineno) {
            alert("System Error: " + message + " (Line: " + lineno + ")");
            return true;
        };

        const TAX_RATE = 0.08; 
        let idleTimer;
        let allProducts = [];
        let currentOrder = {};

        // --- NEW EMAIL/SERIAL FUNCTIONS ---
        function toggleEmailInput() {
            const isChecked = document.getElementById('receiptCheckbox').checked;
            document.getElementById('customerEmail').style.display = isChecked ? 'block' : 'none';
        }

        function generateSerialNumber() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay).toString().padStart(3, '0');
            
            const year = now.getFullYear().toString().slice(-2);
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            return `${dayOfYear}${year}${hours}${minutes}`;
        }

 async function sendDigitalReceipt(customerEmail, finalTotal, serialNumber) {
    // Pointing directly to your secure Cloudflare Bouncer
    const url = "https://stubstation-mailer.brettfell.workers.dev";

    // We only send the raw data; the Bouncer builds the actual email
    const payload = {
        customerEmail: customerEmail,
        finalTotal: finalTotal,
        serialNumber: serialNumber
    };

    try {
        await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
        console.log("Receipt securely handed off to Cloudflare!");
    } catch (error) {
        console.error("Failed to hand off receipt:", error);
    }
}

        // ----------------------------------

        async function loadConfig() {
            try {
                const response = await fetch('config.json');
                window.kioskConfig = await response.json(); 
                document.getElementById('display-venue').innerText = window.kioskConfig.venue_name;
                document.getElementById('display-event').innerText = `${window.kioskConfig.artist_name} - ${window.kioskConfig.door_time}`;
            } catch (error) {
                console.warn("Config load failed, using defaults");
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                allProducts = await response.json();
                const grid = document.querySelector('.grid');
                grid.innerHTML = ''; 
                allProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.image}" class="product-img" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                        <h2>${product.name}</h2>
                        <span class="price">$${product.price}</span>
                        <p style="color:#ccc; font-size:0.9rem;">${product.description}</p>
                        <button onclick="buyProduct('${product.name}')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none; color:black; cursor:pointer;">SELECT</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.warn("Product load failed");
            }
        }

        function showCustomAlert(message) {
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('customAlert').style.display = 'block';
        }

        function closeAlert() {
            document.getElementById('customAlert').style.display = 'none';
            resetTimer(); 
        }

        function toggleGA() {
            const isGA = document.getElementById('gaCheckbox').checked;
            document.getElementById('seatFields').style.display = isGA ? 'none' : 'block';
        }

        function buyProduct(name) {
            currentOrder = allProducts.find(p => p.name === name) || {name: name, price: 5};
            document.getElementById('modalTitle').innerText = name;

            const subtotal = parseFloat(currentOrder.price); 
            const taxAmount = subtotal * TAX_RATE;
            const finalTotal = subtotal + taxAmount;

            currentOrder.finalTotal = finalTotal;

            document.getElementById('displaySubtotal').innerText = subtotal.toFixed(2);
            document.getElementById('displayTax').innerText = taxAmount.toFixed(2);
            document.getElementById('displayTotal').innerText = finalTotal.toFixed(2);

            document.getElementById('gaCheckbox').checked = false;
            toggleGA();

            // Reset email fields for new customer
            document.getElementById('receiptCheckbox').checked = false;
            document.getElementById('customerEmail').value = '';
            toggleEmailInput();

            document.getElementById('orderModal').style.display = 'block';
            document.getElementById('shippingFields').style.display = (subtotal > 10) ? 'block' : 'none';
            resetTimer(); 
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function processOrder() {
            const isGA = document.getElementById('gaCheckbox').checked;
            const row = document.getElementById('rowInput').value.trim();
            const seat = document.getElementById('seatInput').value.trim();

            if (!isGA && (row === "" || seat === "")) {
                showCustomAlert("Please enter your Row and Seat, or select General Admission.");
                return; 
            }

            if (parseFloat(currentOrder.price) > 10) {
                const sName = document.getElementById('shippingName').value.trim();
                const sAddr = document.getElementById('shippingAddress').value.trim();
                if (sName === "" || sAddr === "") {
                    showCustomAlert("Please fill out your shipping information for the display case.");
                    return;
                }
            }

            if (!window.kioskConfig || !window.kioskConfig.square_app_id) {
                showCustomAlert("System loading, please wait a moment.");
                return;
            }

            // --- SAVE RECEIPT DATA BEFORE LEAVING FOR SQUARE ---
            const isReceiptChecked = document.getElementById('receiptCheckbox').checked;
            const customerEmail = document.getElementById('customerEmail').value.trim();
            const serialNumber = generateSerialNumber(); 

            localStorage.setItem('pendingWantsReceipt', isReceiptChecked);
            localStorage.setItem('pendingEmail', customerEmail);
            localStorage.setItem('pendingSerial', serialNumber);
            localStorage.setItem('pendingTotal', currentOrder.finalTotal.toFixed(2));
            // --------------------------------------------------

            const appId = String(window.kioskConfig.square_app_id).replace(/(\r\n|\n|\r)/gm, "").trim();
            const amountCents = parseInt(Math.round(currentOrder.finalTotal * 100));
            const callbackUrl = "https://brettfell.github.io/Stubstation/"; 


            const squareIntent = 
                `intent:#Intent;` +
                `action=com.squareup.pos.action.CHARGE;` +
                `package=com.squareup;` +
                `S.com.squareup.pos.WEB_CALLBACK_URI=${callbackUrl};` +
                `S.com.squareup.pos.CLIENT_ID=${appId};` +
                `S.com.squareup.pos.API_VERSION=v2.0;` + 
                `i.com.squareup.pos.TOTAL_AMOUNT=${amountCents};` + 
                `S.com.squareup.pos.CURRENCY_CODE=USD;` +
                `S.com.squareup.pos.TENDER_TYPES=com.squareup.pos.TENDER_CARD,com.squareup.pos.TENDER_CASH;` +
                `B.com.squareup.pos.AUTO_RETURN_AFTER_PAYMENT=true;` +
                `S.browser_fallback_url=${callbackUrl};` +
                `end`;

            window.location.href = squareIntent;
        }

        window.onload = () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }

            window.history.pushState(null, "", window.location.href);
            window.onpopstate = function() {
                window.history.pushState(null, "", window.location.href);
            };

            const urlParams = new URLSearchParams(window.location.search);
            const hasTransaction = urlParams.has('com.squareup.pos.CLIENT_TRANSACTION_ID');

            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
            const squareChannel = new BroadcastChannel('square_payment_channel');

            if (hasTransaction) {
                // --- FIRE EMAIL IF APPLICABLE ---
                const wantsReceipt = localStorage.getItem('pendingWantsReceipt') === 'true';
                const savedEmail = localStorage.getItem('pendingEmail');
                const savedSerial = localStorage.getItem('pendingSerial');
                const savedTotal = localStorage.getItem('pendingTotal');

                if (wantsReceipt && savedEmail) {
                    sendDigitalReceipt(savedEmail, savedTotal, savedSerial);
                }

                // Clean up sticky note
                localStorage.removeItem('pendingWantsReceipt');
                localStorage.removeItem('pendingEmail');
                localStorage.removeItem('pendingSerial');
                localStorage.removeItem('pendingTotal');
                // --------------------------------

                if (!isStandalone) {
                    squareChannel.postMessage('PAYMENT_SUCCESS');
                    const goHomeIntent = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.HOME;end";

                    document.body.innerHTML = `
                        <div id="rogueTrap" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:999999; display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer;">
                            <h1 style="color:orange; font-size:3rem; text-align:center; font-family:sans-serif; margin-bottom:20px;">Payment Complete!</h1>
                            <p style="color:white; font-size:1.5rem; font-family:sans-serif; background:#333; padding:20px 40px; border-radius:50px; animation: pulse 2s infinite;">TAP ANYWHERE TO RETURN</p>
                        </div>
                    `;

                    document.getElementById('rogueTrap').addEventListener('click', () => {
                        window.location.href = goHomeIntent;
                    });

                    setTimeout(() => {
                        window.location.href = goHomeIntent;
                    }, 500);

                } else {
                    document.getElementById('attract-screen').style.display = 'none';
                    document.getElementById('orderModal').style.display = 'none';
                    document.getElementById('printingScreen').style.display = 'flex';
                    setTimeout(() => { window.location.href = window.location.pathname; }, 10000);
                }
            } else {
                squareChannel.onmessage = (event) => {
                    if (event.data === 'PAYMENT_SUCCESS') {
                        document.getElementById('attract-screen').style.display = 'none';
                        document.getElementById('orderModal').style.display = 'none';
                        document.getElementById('printingScreen').style.display = 'flex';

                        setTimeout(() => {
                            window.location.href = window.location.pathname; 
                        }, 10000);
                    }
                };

                loadConfig();
                loadProducts();
            }
        };

        function startKiosk() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch((e) => console.log("Fullscreen blocked by OS"));
            }

            document.getElementById('rowInput').value = '';
            document.getElementById('seatInput').value = '';
            document.getElementById('shippingName').value = '';
            document.getElementById('shippingAddress').value = '';
            document.getElementById('gaCheckbox').checked = false;
            
            // Reset email fields on fresh start
            document.getElementById('receiptCheckbox').checked = false;
            document.getElementById('customerEmail').value = '';
            
            toggleGA();
            toggleEmailInput();

            const curtain = document.getElementById('attract-screen');
            curtain.style.opacity = '0';
            setTimeout(() => { curtain.style.display = 'none'; }, 500);
            resetTimer();
        }

        function resetTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => { 
                window.location.href = window.location.pathname; 
            }, 60000); 
        }
    </script>
</body>
</html>
