<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto; 
        }

        #attract-screen {
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            margin-top: 30px;
            padding: 25px 50px;
            font-size: 2rem;
            background: orange;
            color: black;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
            width: 90%;
            max-width: 800px;
        }

        .product-card {
            background: rgba(51, 51, 51, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid orange;
        }

        .price {
            font-size: 24px;
            color: #4CAF50;
            display: block;
            margin-bottom: 10px;
        }

        #customAlert {
            display: none; 
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 10001;
        }
/* Container for the images inside the cards */
.product-img {
    width: 100%;
    height: 200px;
    object-fit: contain; /* This prevents the image from stretching */
    background: #111;    /* Slight contrast from the black card */
    border-radius: 8px;
    margin-bottom: 15px;
}

/* Ensure the button stays at the bottom */
.product-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.main-header {
    text-align: center;
    margin: 40px 0; /* Adds space above and below the header */
}

.brand-name {
    font-size: 4rem; /* Big and bold */
    font-weight: 900;
    color: orange;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.tagline {
    font-size: 1.5rem; /* Smaller, supporting text */
    color: #ccc;
    margin-top: 5px;
    font-weight: 300;
}
#orderModal {
    display: none; 
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    color: white;
    padding: 30px;
    border-radius: 20px;
    border: 3px solid orange;
    z-index: 10002;
    width: 85%;
    max-width: 450px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
}

.modal-input {
    width: 90%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 1.1rem;
    background: #333;
    color: white;
}
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.spinner {
    animation: spin 1s linear infinite;
}

    </style>
</head>
<body>

    <div id="attract-screen" onclick="startKiosk()">
        <img src="menuBackground1.jpg" style="max-width: 70%; border-radius: 20px;">
        <button class="start-btn">TOUCH HERE TO GET YOUR RETRO STYLED TICKET</button>
    </div>

    <div class="main-header">
    <div class="brand-name" id="display-venue">StubStation</div>
    <div class="tagline" id="display-event">Bring Home The Original Souvenir</div>
</div>


    <div class="grid">
        <div class="product-card">
            <h2>Get your Souvenir Ticket Stub</h2>
            <span class="price">$5.00</span>
            <button onclick="buyProduct('Get your Souvenir Ticket Stub')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none;">Buy Now</button>
        </div>

        <div class="product-card">
            <h2>Get your ticket stub and order a display case</h2>
            <span class="price">$35.00</span>
            <button onclick="buyProduct('Get your ticket stub and order a display case')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none;">Buy Now</button>
        </div>
    </div>

    <div id="customAlert">
        <h2 id="alertMessage">Message goes here</h2>
        <button onclick="closeAlert()" style="background: #333; color: white; padding: 10px 20px;">Got it!</button>
    </div>
    
    <div id="orderModal">
        <h2 id="modalTitle" style="color:orange; margin-top:0;">Ticket Details</h2>
        
        <input type="text" id="rowInput" class="modal-input" placeholder="Row (e.g., A)">
        <input type="text" id="seatInput" class="modal-input" placeholder="Seat (e.g., 12)">

        <div id="shippingFields" style="display:none; border-top: 1px solid #444; margin-top:15px; padding-top:15px;">
            <h3 style="font-size:1rem; margin-bottom:10px;">Shipping for Display Case:</h3>
            <input type="text" id="shippingName" class="modal-input" placeholder="Full Name">
            <input type="text" id="shippingAddress" class="modal-input" placeholder="Street, City, Zip">
        </div>

        <button onclick="processOrder()" style="width:100%; background:orange; color:black; padding:18px; margin-top:20px; font-weight:bold; border-radius:10px; border:none; font-size:1.3rem;">CONFIRM & PAY</button>
        <button onclick="closeModal()" style="background:transparent; color:#888; border:none; margin-top:10px; width:100%; cursor:pointer;">Cancel</button>
    </div>

    <div id="printingScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 10003; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: orange; font-size: 3rem; text-align: center;">PRINTING YOUR<br>SOUVENIR...</h1>
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid orange; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <script>
let idleTimer;
let allProducts = [];
let currentOrder = {};

// 1. Config Loader
async function loadConfig() {
    try {
        const response = await fetch('config.json');
        window.kioskConfig = await response.json(); 
        document.getElementById('display-venue').innerText = window.kioskConfig.venue_name;
        document.getElementById('display-event').innerText = `${window.kioskConfig.artist_name} - ${window.kioskConfig.door_time}`;
    } catch (error) {
        console.warn("Config load failed", error);
    }
}

// 2. Product Loader
async function loadProducts() {
    try {
        const response = await fetch('products.json');
        allProducts = await response.json();
        const grid = document.querySelector('.grid');
        grid.innerHTML = ''; 
        allProducts.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" class="product-img" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                <h2>${product.name}</h2>
                <span class="price">$${product.price}</span>
                <p style="color:#ccc; font-size:0.9rem;">${product.description}</p>
                <button onclick="buyProduct('${product.name}')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none; color:black; cursor:pointer;">Buy Now</button>
            `;
            grid.appendChild(card);
        });
    } catch (error) {
        console.error("Product load failed", error);
    }
}

function buyProduct(name) {
    currentOrder = allProducts.find(p => p.name === name) || {name: name, price: 5};
    document.getElementById('modalTitle').innerText = name;
    document.getElementById('orderModal').style.display = 'block';
    document.getElementById('shippingFields').style.display = (currentOrder.price > 10) ? 'block' : 'none';
    resetTimer(); // Keep the timer alive when they are interacting
}

function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
}

// 3. THE FIXED PROCESS FUNCTION
function processOrder() {
    // 1. Clean the App ID safely
    const appId = String(window.kioskConfig.square_app_id).replace(/(\r\n|\n|\r)/gm, "").trim();
    const amountCents = parseInt(Math.round(currentOrder.price * 100));
    const callbackUrl = "https://brettfell.github.io/Stubstation/"; 

    const squareIntent = 
        `intent:#Intent;` +
        `action=com.squareup.pos.action.CHARGE;` +
        `package=com.squareup;` +
        `S.com.squareup.pos.WEB_CALLBACK_URI=${callbackUrl};` +
        `S.com.squareup.pos.CLIENT_ID=${appId};` +
        `S.com.squareup.pos.API_VERSION=v2.0;` + 
        `i.com.squareup.pos.TOTAL_AMOUNT=${amountCents};` + 
        `S.com.squareup.pos.CURRENCY_CODE=USD;` +
        `S.com.squareup.pos.TENDER_TYPES=com.squareup.pos.TENDER_CARD,com.squareup.pos.TENDER_CASH;` +
        `b.com.squareup.pos.AUTO_RETURN_AFTER_PAYMENT=true;` +
        `S.browser_fallback_url=${callbackUrl};` +
        `end`;

    console.log("Jumping to Square...");
    window.location.href = squareIntent;
}

// 4. Initialization & Success Handling
window.onload = () => {
    // A. DEFEAT "GHOST DATA" - Force inputs to clear immediately on page load
    document.getElementById('rowInput').value = '';
    document.getElementById('seatInput').value = '';
    document.getElementById('shippingName').value = '';
    document.getElementById('shippingAddress').value = '';

    loadConfig();
    loadProducts();

    // B. Check if we just returned from a successful Square payment
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('com.squareup.pos.CLIENT_TRANSACTION_ID')) {
        console.log("Payment Success Detected!");

        // 1. Erase the Transaction ID from the URL *first* so a reload doesn't trigger this again
        window.history.replaceState({}, document.title, window.location.pathname);

        // 2. Hide everything else
        document.getElementById('attract-screen').style.display = 'none';
        document.getElementById('orderModal').style.display = 'none';

        // 3. Show the Printing Screen
        document.getElementById('printingScreen').style.display = 'flex';

        // 4. Reset to the start screen after 10 seconds
        setTimeout(() => {
            location.reload(); 
        }, 10000);
    }
};

function startKiosk() {
    const curtain = document.getElementById('attract-screen');
    curtain.style.opacity = '0';
    setTimeout(() => { curtain.style.display = 'none'; }, 500);
    resetTimer();
}

function resetTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { 
        // Ensure inputs are wiped if it times out
        document.getElementById('rowInput').value = '';
        document.getElementById('seatInput').value = '';
        document.getElementById('shippingName').value = '';
        document.getElementById('shippingAddress').value = '';

        location.reload(); 
    }, 60000); 
}

</script>
</body>
</html>
