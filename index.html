<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto; 
        }

        #attract-screen {
            position: fixed; 
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; 
            z-index: 10000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            margin-top: 30px;
            padding: 25px 50px;
            font-size: 2rem;
            background: orange;
            color: black;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 20px;
            width: 90%;
            max-width: 800px;
        }

        .product-card {
            background: rgba(51, 51, 51, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid orange;
        }

        .price {
            font-size: 24px;
            color: #4CAF50;
            display: block;
            margin-bottom: 10px;
        }

        #customAlert {
            display: none; 
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 10001;
        }
/* Container for the images inside the cards */
.product-img {
    width: 100%;
    height: 200px;
    object-fit: contain; /* This prevents the image from stretching */
    background: #111;    /* Slight contrast from the black card */
    border-radius: 8px;
    margin-bottom: 15px;
}

/* Ensure the button stays at the bottom */
.product-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.main-header {
    text-align: center;
    margin: 40px 0; /* Adds space above and below the header */
}

.brand-name {
    font-size: 4rem; /* Big and bold */
    font-weight: 900;
    color: orange;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.tagline {
    font-size: 1.5rem; /* Smaller, supporting text */
    color: #ccc;
    margin-top: 5px;
    font-weight: 300;
}
#orderModal {
    display: none; 
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a1a;
    color: white;
    padding: 30px;
    border-radius: 20px;
    border: 3px solid orange;
    z-index: 10002;
    width: 85%;
    max-width: 450px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
}

.modal-input {
    width: 90%;
    padding: 15px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 1.1rem;
    background: #333;
    color: white;
}
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.spinner {
    animation: spin 1s linear infinite;
}

    </style>
</head>
<body>

    <div id="attract-screen" onclick="startKiosk()">
        <img src="menuBackground1.jpg" style="max-width: 70%; border-radius: 20px;">
        <button class="start-btn">TOUCH HERE TO GET YOUR RETRO STYLED TICKET</button>
    </div>

    <div class="main-header">
    <div class="brand-name" id="display-venue">StubStation</div>
    <div class="tagline" id="display-event">Bring Home The Original Souvenir</div>
</div>


    <div class="grid">
        <div class="product-card">
            <h2>Get your Souvenir Ticket Stub</h2>
            <span class="price">$5.00</span>
            <button onclick="buyProduct('Get your Souvenir Ticket Stub')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none;">Buy Now</button>
        </div>

        <div class="product-card">
            <h2>Get your ticket stub and order a display case</h2>
            <span class="price">$35.00</span>
            <button onclick="buyProduct('Get your ticket stub and order a display case')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none;">Buy Now</button>
        </div>
    </div>

    <div id="customAlert">
        <h2 id="alertMessage">Message goes here</h2>
        <button onclick="closeAlert()" style="background: #333; color: white; padding: 10px 20px;">Got it!</button>
    </div>
    
    <div id="orderModal">
        <h2 id="modalTitle" style="color:orange; margin-top:0;">Ticket Details</h2>
        
        <input type="text" id="rowInput" class="modal-input" placeholder="Row (e.g., A)">
        <input type="text" id="seatInput" class="modal-input" placeholder="Seat (e.g., 12)">

        <div id="shippingFields" style="display:none; border-top: 1px solid #444; margin-top:15px; padding-top:15px;">
            <h3 style="font-size:1rem; margin-bottom:10px;">Shipping for Display Case:</h3>
            <input type="text" id="shippingName" class="modal-input" placeholder="Full Name">
            <input type="text" id="shippingAddress" class="modal-input" placeholder="Street, City, Zip">
        </div>

        <button onclick="processOrder()" style="width:100%; background:orange; color:black; padding:18px; margin-top:20px; font-weight:bold; border-radius:10px; border:none; font-size:1.3rem;">CONFIRM & PAY</button>
        <button onclick="closeModal()" style="background:transparent; color:#888; border:none; margin-top:10px; width:100%; cursor:pointer;">Cancel</button>
    </div>

    <div id="printingScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 10003; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: orange; font-size: 3rem; text-align: center;">PRINTING YOUR<br>SOUVENIR...</h1>
        <div class="spinner" style="width: 50px; height: 50px; border: 5px solid #333; border-top: 5px solid orange; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <script>
alert("Script has loaded successfully!");
let idleTimer;
let allProducts = [];
let currentOrder = {};

// 1. Bulletproof Config Loader
async function loadConfig() {
    console.log("Attempting to load config...");
    try {
        const response = await fetch('config.json');
        if (!response.ok) throw new Error('File not found');
        const configData = await response.json();
        
        document.getElementById('display-venue').innerText = configData.venue_name;
        document.getElementById('display-event').innerText = `${configData.artist_name} - ${configData.door_time}`;
        window.kioskConfig = configData; 
    } catch (error) {
        console.warn("Config load failed, using defaults:", error);
        // Fallback so the screen isn't empty
        document.getElementById('display-venue').innerText = "StubStation";
        document.getElementById('display-event').innerText = "Bring Home The Original Souvenir";
    }
}

// 2. Bulletproof Product Loader
async function loadProducts() {
    console.log("Attempting to load products...");
    try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('File not found');
        allProducts = await response.json();
        
        const grid = document.querySelector('.grid');
        grid.innerHTML = ''; 

        allProducts.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" class="product-img" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                <h2>${product.name}</h2>
                <span class="price">$${product.price}</span>
                <p style="color:#ccc; font-size:0.9rem;">${product.description}</p>
                <button onclick="buyProduct('${product.name}')" style="padding:15px; background:orange; font-weight:bold; border-radius:10px; border:none; color:black; cursor:pointer;">Buy Now</button>
            `;
            grid.appendChild(card);
        });
    } catch (error) {
        console.error("Product load failed:", error);
        // Add a manual button if JSON fails so you can at least test the popup
        document.querySelector('.grid').innerHTML = `<button onclick="buyProduct('Test Item', 5)" style="padding:20px; background:orange;">JSON Load Error - Click for Test Popup</button>`;
    }
}

// 3. User selects a product
function processOrder() {
    // DIAGNOSTIC 1: Checks if the button is even connected
    alert("Function started! Row: " + document.getElementById('rowInput').value);

    const row = document.getElementById('rowInput').value;
    const seat = document.getElementById('seatInput').value;
    
    if(!row || !seat) return alert("Please enter Row and Seat");

    // Pull IDs from config
    const appId = window.kioskConfig.square_app_id;
    const locationId = window.kioskConfig.square_location_id;
    const callbackUrl = window.location.origin + window.location.pathname;
    const amountCents = currentOrder.price * 100;

    const squareIntent = 
        `intent:#Intent;` +
        `action=com.squareup.pos.action.CHARGE;` +
        `package=com.squareup;` +
        `S.com.squareup.pos.WEB_CALLBACK_URI=${callbackUrl};` +
        `S.com.squareup.pos.CLIENT_ID=${appId};` +
        `S.com.squareup.pos.API_VERSION=v1.3;` +
        `i.com.squareup.pos.TOTAL_AMOUNT=${amountCents};` +
        `S.com.squareup.pos.CURRENCY_CODE=USD;` +
        `S.com.squareup.pos.TENDER_TYPES=com.squareup.pos.TENDER_CARD,com.squareup.pos.TENDER_CARD_ON_FILE,com.squareup.pos.TENDER_CASH;` +
        `S.com.squareup.pos.LOCATION_ID=${locationId};` +
        `S.com.squareup.pos.NOTE=${encodeURIComponent(currentOrder.name + " | Row:" + row + " Seat:" + seat)};` +
        `end`;

    // DIAGNOSTIC 2: Checks if the code successfully built the Square link
    alert("Jumping to Square now...");

    window.location.href = squareIntent;
}


function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
}

// Kiosk Management
function startKiosk() {
    console.log("Start Button Pushed");
    const curtain = document.getElementById('attract-screen');
    curtain.style.opacity = '0';
    setTimeout(() => { 
        curtain.style.display = 'none'; 
    }, 500);
    resetTimer();
}

function resetTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { location.reload(); }, 60000); 
}

// INIT (The critical part)
window.onload = () => {
    console.log("Page Loaded");
    document.body.style.border = "5px solid green"; // Changed to Green to show success!
    loadConfig();
    loadProducts();
};
function resetTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
        // Clear all sensitive data before the page reloads
        document.getElementById('rowInput').value = '';
        document.getElementById('seatInput').value = '';
        document.getElementById('shippingName').value = '';
        document.getElementById('shippingAddress').value = '';
        
        console.log("Session timed out. Clearing data and returning to home.");
        location.reload(); 
    }, 60000); // 60 Seconds
}

    </script>
</body>
</html>
